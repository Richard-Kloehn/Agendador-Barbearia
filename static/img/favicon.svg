<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo escuro -->
  <rect width="100" height="100" rx="20" fill="#1a1a1a"/>
  
  <!-- Tesoura estilizada -->
  <g transform="translate(50, 50)">
    <!-- Círculo esquerdo da tesoura -->
    <circle cx="-15" cy="-10" r="8" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Círculo direito da tesoura -->
    <circle cx="15" cy="-10" r="8" fill="none" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Lâminas -->
    <line x1="-15" y1="-10" x2="-5" y2="15" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="-10" x2="5" y2="15" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Ponto central -->
    <circle cx="0" cy="5" r="4" fill="url(#grad1)"/>
  </g>
</svg>
